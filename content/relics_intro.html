<p class="lede">Relics come from relic boxes, the reward for winning the creep rounds at 10, 20, 30, 40 and 50. Each game only 10 random relics are available, and a relic lasts until the next relic round. Talents are chosen at rounds 5, 15, 25 and 35. <a href="../guide/items.html">More about relics and talents →</a></p>
